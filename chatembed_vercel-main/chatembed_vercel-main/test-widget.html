<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmbedEase Widget Integration Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 3rem 1.5rem;
      background: #F6F4EF;
      color: #0F1210;
      line-height: 1.6;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    h1 { margin-top: 0; color: #0E6B4D; font-size: 1.6rem; }
    .badge {
      display: inline-block;
      background: #E8F5E9;
      color: #0E6B4D;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    code {
      background: #f1f3f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .test-actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 10px;
    }
    button {
      background: #0E6B4D;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Verification Environment</span>
    <h1>EmbedEase Test Harness</h1>
    <p>This page tests the upgraded <code>widget.js</code> with simulated attribution parameters:</p>
    <ul>
      <li><strong>UTM Source:</strong> <code>meta</code></li>
      <li><strong>UTM Campaign:</strong> <code>summer_sale_2026</code></li>
      <li><strong>Click ID:</strong> <code>gclid=mock_gclid_998811</code></li>
    </ul>

    <div class="test-actions">
      <button onclick="window.EmbedEase.open()">Open Chatbot</button>
      <button onclick="window.EmbedEase.track('custom_test_event', { tier: 'growth' })">Fire Telemetry Event</button>
    </div>
  </div>

  <!-- EmbedEase Chatbot Widget -->
  <script src="widget.js"
    data-bot-id="test-demo-bot-123"
    data-color="#0E6B4D"
    data-name="Aria Growth Assistant"
    data-whatsapp="919425625642"
    data-welcome="Hi there! Welcome to EmbedEase. How can we help your business grow today?">
  </script>
</body>
</html>
